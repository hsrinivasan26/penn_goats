<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Chryseos">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a9760a"/>
      <stop offset="0.45" stop-color="#f2c53d"/>
      <stop offset="0.8" stop-color="#ffe38a"/>
      <stop offset="1" stop-color="#fff6cf"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c8922a"/>
      <stop offset="1" stop-color="#ffe9a3"/>
    </linearGradient>
  </defs>
  <!-- emblem ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
  <!-- lower swoosh (tail) -->
  <path d="M20 64 C 40 62, 56 56, 72 38" fill="none" stroke="url(#goldSoft)"
        stroke-width="5.5" stroke-linecap="round" opacity="0.6"/>
  <!-- rising arrow shaft -->
  <path d="M25 60 C 44 57, 57 49, 68 31" fill="none" stroke="url(#gold)"
        stroke-width="8.5" stroke-linecap="round"/>
  <!-- arrowhead -->
  <path d="M55.5 26.5 L74 24 L69.5 42 Z" fill="url(#gold)"/>
</svg>
